<title>電子實驗模擬台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面:左側為工作檯(工具列、麵包板、實驗題目),右側為四台儀器;窄螢幕改為單欄 */
:root{
  --bg:#e8ebee; --panel:#f7f8f9; --panel-2:#eceff2; --line:#cbd2d9; --fg:#192027; --muted:#58656f;
  --accent:#0a7c76; --accent-fg:#ffffff; --ok:#1c8f4f; --bad:#d23f3f; --warn:#b7791f;
  --board:#e9e5d7; --board-edge:#b9b39d; --groove:#cfc9b6; --hole:#3b3f45; --hole-hi:#f0a800;
  --rail-p:#d64545; --rail-n:#3b6fd6; --metal:#9aa0a6; --lbl:#3a352a;
  --screen:#06100c; --seg:#7dff9a; --seg-bg:#0a1511;
  --font:'IBM Plex Sans','Noto Sans TC',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --panel:#171c21; --panel-2:#1e252b; --line:#2b343c; --fg:#e3e8ec; --muted:#8f9ba6;
  --accent:#3cc4bb; --accent-fg:#06201e; --ok:#3ccf7a; --bad:#ff6b6b; --warn:#e0a84a;
  --board:#d8d3c2; --board-edge:#8f8a76; --groove:#bfb9a5; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1317; --panel:#171c21; --panel-2:#1e252b; --line:#2b343c; --fg:#e3e8ec; --muted:#8f9ba6;
  --accent:#3cc4bb; --accent-fg:#06201e; --ok:#3ccf7a; --bad:#ff6b6b; --warn:#e0a84a;
  --board:#d8d3c2; --board-edge:#8f8a76; --groove:#bfb9a5; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;letter-spacing:.01em}
h2{font-size:13px;margin:0;font-weight:600;letter-spacing:.04em}
h3{font-size:16px;margin:0}
h4{font-size:13.5px;margin:6px 0 0}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;max-width:1360px;margin:0 auto 14px}
.sub{margin:4px 0 0;color:var(--muted);max-width:64ch}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,410px);gap:16px;align-items:start;max-width:1360px;margin:0 auto}
@media (max-width:1000px){.lab-grid{grid-template-columns:minmax(0,1fr)}}
.bench,.instruments{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}

button,select,input{font:inherit;color:inherit}
button,select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:34px}
button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%;min-height:24px}
input[type=number],.cell{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-height:30px;font-family:var(--mono)}
input[type=number]{width:84px}
.cell{width:88px;text-align:right}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 12px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center}
.sw{display:flex;gap:6px}
.sw button{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px;border-color:var(--panel)}
.board{padding:8px;overflow:hidden}
#board{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair;user-select:none}
.hint{margin:0;padding:0 2px;min-height:1.5em;color:var(--muted)}
.hint.warn{color:var(--bad);font-weight:500}

/* 麵包板 SVG */
.bb{fill:var(--board);stroke:var(--board-edge);stroke-width:1.5}
.groove{fill:var(--groove)}
.hole{fill:var(--hole)}
.hole.on{fill:var(--hole-hi)}
.rail-p{stroke:var(--rail-p);stroke-width:1.6}
.rail-n{stroke:var(--rail-n);stroke-width:1.6}
.tgrp{fill:var(--panel-2);stroke:var(--line)}
.tlabel{fill:var(--muted);font:500 10px var(--font);text-anchor:middle}
.tsub{fill:var(--fg);font:500 9px var(--mono);text-anchor:middle}
.cn{fill:var(--lbl);font:9px var(--mono);text-anchor:middle;opacity:.7}
.bbtxt{fill:var(--lbl);font:700 10px var(--mono);text-anchor:middle}
.com{stroke:var(--muted);stroke-dasharray:3 3;fill:none}
.leg{stroke:var(--metal);stroke-width:2.2;stroke-linecap:round}
.lbl{fill:var(--lbl);font:500 9px var(--mono);text-anchor:middle;paint-order:stroke;stroke:var(--board);stroke-width:3px}
.ring{fill:none;stroke:var(--hole-hi);stroke-width:2}
.ghost{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 4;fill:none}
.pin{fill:var(--metal)}
.icpin{fill:#fff;font:600 5.5px var(--mono);text-anchor:middle}

/* 實驗題目 */
.lab-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);border-radius:8px 8px 0 0}
.lab-h h2{margin-right:6px}
.lab-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lab-body p,.lab-body ol,.lab-body ul{margin:0}
.lab-body ol,.lab-body ul{padding-left:20px}
.lab-body li{margin:2px 0}
.muted{color:var(--muted)}
.wrapx{overflow-x:auto}
.ltbl{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
.ltbl th,.ltbl td{border:1px solid var(--line);padding:3px 6px;text-align:right;white-space:nowrap}
.ltbl th{background:var(--panel-2);font-weight:500;color:var(--muted)}
.ltbl td:first-child,.ltbl th:first-child{text-align:left}
.calc{font-family:var(--mono)}
.ans{color:var(--accent)}
.lab-body:not(.show-ans) .ans{visibility:hidden}
.ok{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
.row2{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chart{width:100%;max-width:520px;height:210px;display:block;background:var(--panel-2);border:1px solid var(--line);border-radius:6px}
.rsvg{display:block;background:var(--board);border-radius:6px;border:1px solid var(--board-edge)}
details.peek{padding:8px 12px}
details.peek summary{cursor:pointer;font-weight:600;font-size:13px}


/* 電路圖 */
.fig{margin:0;display:flex;flex-direction:column;gap:2px}
.fig figcaption{font-size:12px;color:var(--muted)}
.sch{width:100%;max-width:400px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px}
.sch path,.sch circle{stroke:var(--fg);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sch circle.dot{fill:var(--fg)}
.sch text{fill:var(--fg);font:11px var(--mono)}
.figs{display:flex;flex-wrap:wrap;gap:10px}

/* 讀數表 */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
.tbl td:first-child{font-family:var(--font);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:0 7px;border-radius:10px;font:500 11px/18px var(--font);margin-left:6px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.empty{color:var(--muted);margin:2px 0}

/* 儀器 */
.inst{padding:0;overflow:hidden}
.inst>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.tag{font:500 11px var(--mono);color:var(--muted)}
.inst-body{padding:12px;display:flex;flex-direction:column;gap:12px}
#scr{display:block;width:100%;aspect-ratio:5/4;border-radius:6px;background:var(--screen)}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{background:var(--screen);border-radius:6px;padding:8px 10px;font:12px/1.55 var(--mono);color:#cfe;font-variant-numeric:tabular-nums}
.mcol b{display:block;font-weight:500;margin-bottom:2px}
.mcol.c1 b{color:#ffd400}.mcol.c2 b{color:#28d7ff}
.mrow{display:flex;justify-content:space-between;gap:8px}.mrow span:first-child{opacity:.6}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{margin:0;padding:6px 10px 10px;border:1px solid var(--line);border-radius:6px;min-width:0;display:flex;flex-direction:column;gap:6px}
legend{padding:0 4px;font-weight:600}
fieldset.ch1 legend{color:#b08d00}fieldset.ch2 legend{color:#0a8fb0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) fieldset.ch1 legend{color:#ffd400}:root:not([data-theme="light"]) fieldset.ch2 legend{color:#28d7ff}}
:root[data-theme="dark"] fieldset.ch1 legend{color:#ffd400}:root[data-theme="dark"] fieldset.ch2 legend{color:#28d7ff}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row>label{white-space:nowrap}
.row select{min-width:0;max-width:100%;padding:4px 6px;min-height:30px}
.fld{display:flex;flex-direction:column;gap:2px}
.fld .row span{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg4{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.disp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lcd{background:var(--seg-bg);border-radius:6px;padding:8px 10px;color:var(--seg);font:500 26px/1.1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.lcd small{display:block;text-align:left;font:11px var(--font);opacity:.7;letter-spacing:.06em;margin-bottom:2px}
.lcd i{font-style:normal;font-size:14px;margin-left:4px;opacity:.8}
.lcd.bigl{font-size:34px}
.mode{display:flex;gap:6px;align-items:center;font:500 12px var(--mono)}
.pill{padding:0 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);line-height:20px}
.pill.cv{color:var(--ok);border-color:var(--ok)}.pill.cc{color:var(--bad);border-color:var(--bad)}
.note{margin:0;color:var(--muted);font-size:12px}
.note.warn{color:var(--bad)}
.big{min-height:38px;font-weight:600}
</style>

<header class="top">
  <div>
    <h1>電子實驗模擬台</h1>
    <p class="sub">麵包板、電阻、LED、LM324 與跳線,搭配電源供應器、訊號產生器、示波器和三用電表。所有儀器都要自己調整,就像在實驗室一樣。</p>
  </div>
  <div class="top-actions">
    <label for="preset">範例電路</label>
    <select id="preset" aria-label="載入範例電路(只放電路,不設定儀器)"></select>
    <button id="clear" type="button">清除全部</button>
  </div>
</header>

<main class="lab-grid">
  <section class="bench">
    <div class="toolbar panel" role="toolbar" aria-label="元件工具">
      <div class="tools">
        <button type="button" data-tool="R" aria-pressed="true">電阻</button>
        <button type="button" data-tool="LED" aria-pressed="false">發光二極體</button>
        <button type="button" data-tool="IC" aria-pressed="false">LM324</button>
        <button type="button" data-tool="W" aria-pressed="false">跳線</button>
        <button type="button" data-tool="DEL" aria-pressed="false">刪除</button>
      </div>
      <div class="opts">
        <label id="optR" for="rval">阻值 <select id="rval"></select></label>
        <label id="optR2" for="rtol">誤差 <select id="rtol"><option value="5">±5%(金)</option><option value="1">±1%(棕)</option></select></label>
        <label id="optL" for="lcol" hidden>顏色 <select id="lcol"></select></label>
        <div id="optW" class="sw" role="group" aria-label="跳線顏色" hidden></div>
      </div>
    </div>
    <div class="board panel"><svg id="board" viewBox="0 0 660 435" role="img" aria-label="麵包板與儀器接線端子"></svg></div>
    <p id="hint" class="hint" aria-live="polite"></p>

    <section class="panel" id="labpanel" aria-label="實驗題目">
      <header class="lab-h">
        <h2>實驗題目</h2>
        <select id="labsel" aria-label="選擇實驗">
          <option value="0">自由實驗</option>
          <option value="1">實驗一 元件測量與誤差</option>
          <option value="2">實驗二 阻抗匹配</option>
          <option value="3">實驗三 電阻電路與誤差</option>
          <option value="4">實驗四 LED 與整流</option>
          <option value="5">實驗五 比較器</option>
        </select>
        <button id="labnew" type="button">新題目</button>
        <button id="labans" type="button" aria-pressed="false">對答案</button>
      </header>
      <div class="lab-body" id="labbody"></div>
    </section>

    <details class="panel peek">
      <summary>元件讀數(對答案用,實驗時請改用儀器量測)</summary>
      <div class="wrapx" id="rd"></div>
    </details>
  </section>

  <aside class="instruments">
    <section class="inst panel" aria-label="示波器">
      <header><h2>示波器</h2><span class="tag">DSO · 2 CH · 輸入 1 MΩ</span></header>
      <div class="inst-body">
        <canvas id="scr" aria-label="示波器螢幕"></canvas>
        <p class="note" id="scnote" hidden></p>
        <div class="meas" id="meas" hidden></div>
        <div class="btns">
          <button type="button" id="runstop" aria-pressed="true">RUN</button>
          <button type="button" id="curbtn" aria-pressed="false">游標</button>
          <button type="button" id="measbtn" aria-pressed="false">測量</button>
        </div>
        <div class="cgrid">
          <fieldset class="ch1"><legend><label><input type="checkbox" id="c1on" checked> CH1</label></legend>
            <div class="row"><label for="cp1">耦合</label><select id="cp1"><option value="dc">DC</option><option value="ac">AC</option><option value="gnd">GND</option></select></div>
            <div class="row"><label for="vd1">V/div</label><select id="vd1"></select></div>
            <div class="row"><label for="p1">位置</label><input type="range" id="p1" min="-4" max="4" step="0.1" value="0"></div></fieldset>
          <fieldset class="ch2"><legend><label><input type="checkbox" id="c2on" checked> CH2</label></legend>
            <div class="row"><label for="cp2">耦合</label><select id="cp2"><option value="dc">DC</option><option value="ac">AC</option><option value="gnd">GND</option></select></div>
            <div class="row"><label for="vd2">V/div</label><select id="vd2"></select></div>
            <div class="row"><label for="p2">位置</label><input type="range" id="p2" min="-4" max="4" step="0.1" value="0"></div></fieldset>
          <fieldset><legend>水平</legend>
            <div class="row"><label for="td">T/div</label><select id="td"></select></div>
            <div class="row"><label for="hp">位置</label><input type="range" id="hp" min="-5" max="5" step="0.1" value="0"></div></fieldset>
          <fieldset><legend>觸發</legend>
            <div class="row"><label for="tsrc">來源</label><select id="tsrc"><option value="1">CH1</option><option value="2">CH2</option></select></div>
            <div class="row"><label for="tslope">斜率</label><select id="tslope"><option value="r">上升</option><option value="f">下降</option></select></div>
            <div class="row"><label for="tmode">模式</label><select id="tmode"><option value="auto">AUTO</option><option value="norm">NORMAL</option></select></div>
            <div class="row"><label for="tl">準位</label><input type="range" id="tl" min="-4" max="4" step="0.05" value="0"></div></fieldset>
        </div>
      </div>
    </section>

    <section class="inst panel" aria-label="訊號產生器">
      <header><h2>訊號產生器</h2><span class="tag">1 Hz–1 MHz · 輸出阻抗 50 Ω · 振幅為開路電壓</span></header>
      <div class="inst-body">
        <div class="seg" role="group" aria-label="波形">
          <button type="button" data-wave="sine" aria-pressed="true">正弦波</button>
          <button type="button" data-wave="square" aria-pressed="false">方波</button>
          <button type="button" data-wave="tri" aria-pressed="false">三角波</button>
        </div>
        <div class="fld"><div class="row"><label for="fval">頻率</label>
          <span><input type="number" id="fval" min="1" step="any" aria-label="頻率數值"> <select id="funit" aria-label="頻率單位"><option value="1">Hz</option><option value="1000">kHz</option><option value="1000000">MHz</option></select></span></div>
          <input type="range" id="fs" min="0" max="600" step="1" aria-label="頻率滑桿"></div>
        <div class="fld"><div class="row"><label for="fa">振幅(峰對峰)</label><span id="fat"></span></div><input type="range" id="fa" min="0" max="20" step="0.1"></div>
        <div class="fld"><div class="row"><label for="fo">直流偏移</label><span id="fot"></span></div><input type="range" id="fo" min="-10" max="10" step="0.1"></div>
        <div class="row"><span class="note">頻率 1–3 Hz 時,LED 會即時閃爍</span><button class="big" type="button" id="fon" aria-pressed="false">輸出 OFF</button></div>
      </div>
    </section>

    <section class="inst panel" aria-label="電源供應器">
      <header><h2>電源供應器</h2><span class="tag">DC 0–30 V · 0–1 A</span></header>
      <div class="inst-body">
        <div class="disp">
          <div class="lcd"><small>輸出電壓</small><span id="psv">0.00</span><i>V</i></div>
          <div class="lcd"><small>輸出電流</small><span id="psi">0.000</span><i>A</i></div>
        </div>
        <div class="fld"><div class="row"><label for="pv">設定電壓</label><span id="pvt"></span></div><input type="range" id="pv" min="0" max="30" step="0.1"></div>
        <div class="fld"><div class="row"><label for="pi">電流限制</label><span id="pit"></span></div><input type="range" id="pi" min="0.01" max="1" step="0.01"></div>
        <div class="row"><div class="mode"><span class="pill" id="pmode">OFF</span></div><button class="big" type="button" id="pon" aria-pressed="false">輸出 OFF</button></div>
      </div>
    </section>

    <section class="inst panel" aria-label="三用電表">
      <header><h2>三用電表</h2><span class="tag">DMM · 6000 counts · 輸入 10 MΩ</span></header>
      <div class="inst-body">
        <div class="lcd bigl"><small id="mmmode">DC V</small><span id="mmval">----</span><i id="mmunit">V</i></div>
        <div class="seg4" role="group" aria-label="量測檔位">
          <button type="button" data-mm="dcv" aria-pressed="true">直流電壓 V⎓</button>
          <button type="button" data-mm="acv" aria-pressed="false">交流電壓 V~</button>
          <button type="button" data-mm="ohm" aria-pressed="false">電阻 Ω</button>
          <button type="button" data-mm="dca" aria-pressed="false">直流電流 A⎓</button>
        </div>
        <div class="row"><label for="mmu">電表</label><select id="mmu"><option value="A">電表 A</option><option value="B">電表 B</option></select></div>
        <p class="note" id="mmnote"></p>
      </div>
    </section>
  </aside>
</main>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};

/* ---------- 電路求解(改良節點分析 + 牛頓法) ---------- */
const GMIN=1e-9,GO=1/50;
function buildNets(){
  const par=new Map();
  const find=k=>{if(!par.has(k))par.set(k,k);let r=k;while(par.get(r)!==r)r=par.get(r);let c=k;while(par.get(c)!==r){const n=par.get(c);par.set(c,r);c=n;}return r;};
  const union=(a,b)=>{a=find(a);b=find(b);if(a!==b)par.set(a,b);};
  union('FGG','SCG');
  for(const p of S.parts)if(p.type==='W')union(points[p.a].node,points[p.b].node);
  return find;
}
function compile(){
  const find=buildNets(),earth=find('FGG'),idx=new Map();let N=0;
  const nid=k=>{const r=find(k);if(r===earth)return -1;if(!idx.has(r))idx.set(r,N++);return idx.get(r);};
  const Rs=[],Ds=[],OA=[];
  for(const p of S.parts){
    if(p.type==='W')continue;
    if(p.type==='IC'){const pin=n=>nid(icPin(p,n)),vp=pin(4),vn=pin(11);
      for(const [o,m,pl] of [[1,2,3],[7,6,5],[8,9,10],[14,13,12]])OA.push({o:pin(o),m:pin(m),p:pin(pl),vp,vn,vt:0});
      continue;}
    const a=nid(points[p.a].node),b=nid(points[p.b].node);
    if(p.type==='R')Rs.push({id:p.id,a,b,r:act(p)});
    else if(!p.burned){const nVt=2*0.02585,Is=0.02/Math.exp(LEDC[p.color].vf/nVt);Ds.push({id:p.id,a,b,nVt,Is,vcrit:nVt*Math.log(nVt/(Math.SQRT2*Is)),vd:lastVd.get(p.id)||0});}}
  const C={psp:nid('PS+'),psn:nid('PS-'),c1:nid('CH1'),c2:nid('CH2'),fgo:nid('FGO'),mp:nid('MV'),mn:nid('MC'),Rs,Ds,OA};
  C.fgi=N++;C.N=N;return C;
}
function fgValue(t){const f=S.fg,ph=((t*f.f)%1+1)%1,A=f.vpp/2;
  if(f.wave==='sine')return f.off+A*Math.sin(2*Math.PI*ph);
  if(f.wave==='square')return f.off+(ph<0.5?A:-A);
  return f.off+A*(ph<0.5?4*ph-1:3-4*ph);}
function pnjlim(vn,vo,vt,vc){if(vn>vc&&Math.abs(vn-vo)>2*vt){if(vo>0){const a=1+(vn-vo)/vt;vn=a>0?vo+vt*Math.log(a):vc;}else vn=vt*Math.log(vn/vt);}return vn;}
function gauss_(A,b,n){
  for(let c=0;c<n;c++){let p=c,m=Math.abs(A[c][c]);for(let r=c+1;r<n;r++){const v=Math.abs(A[r][c]);if(v>m){m=v;p=r;}}
    if(m<1e-30)continue;if(p!==c){[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];}
    const d=A[c][c];for(let r=c+1;r<n;r++){const f=A[r][c]/d;if(!f)continue;const Ar=A[r],Ac=A[c];for(let k=c;k<n;k++)Ar[k]-=f*Ac[k];b[r]-=f*b[c];}}
  const x=new Float64Array(n);
  for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=A[r][k]*x[k];x[r]=Math.abs(A[r][r])<1e-30?0:s/A[r][r];}
  return x;
}
const stamp=(A,i,j,g)=>{if(i>=0)A[i][i]+=g;if(j>=0)A[j][j]+=g;if(i>=0&&j>=0){A[i][j]-=g;A[j][i]-=g;}};
function runNewton(C,t,mode,opt={}){
  const N=C.N,fgOn=S.fg.on&&!opt.noSrc;let nv=0;const fk=fgOn?nv++:-1,pk=mode==='cv'?nv++:-1,n=N+nv;
  const A0=Array.from({length:n},()=>new Float64Array(n)),b0=new Float64Array(n);
  for(let i=0;i<N;i++)A0[i][i]+=GMIN;
  if(C.c1>=0)A0[C.c1][C.c1]+=1e-6;if(C.c2>=0)A0[C.c2][C.c2]+=1e-6;   // 示波器輸入阻抗 1 MΩ
  if(!opt.noSrc){const mm=S.mm.mode;if(mm==='dcv'||mm==='acv')stamp(A0,C.mp,C.mn,1e-7);else if(mm==='dca')stamp(A0,C.mp,C.mn,10);}

/* ---------- 分析:一個週期的取樣表 ---------- */
let R=null,C=null;
const NPER=512;

function analyze(){
  let per;const nP=S.fg.on?NPER:1,T=S.fg.on?1/S.fg.f:1;
  for(let pass=0;pass<5;pass++){
    C=compile();per=[];for(let k=0;k<nP;k++)per.push(simAt(C,k/nP*T));
    let burned=false;
    for(const p of S.parts){if(p.type!=='LED'||p.burned)continue;let pk=0;
      for(const s of per){const d=s.D.find(q=>q.id===p.id);if(d)pk=Math.max(pk,Math.abs(d.i));}
      if(pk>0.08){p.burned=true;burned=true;say(`${labelOf(p)} 因電流過大(${eng(pk,'A')})燒毀了。請在 LED 前串聯限流電阻。`,true);lastVd.delete(p.id);}}
    if(!burned)break;

  const res=new Map(),led=new Map();
  C.Rs.forEach((r,j)=>{const v=per.map(s=>s.R[j].v);const vr=Math.sqrt(mean(v.map(x=>x*x))),ir=vr/r.r,pw=mean(v.map(x=>x*x/r.r));res.set(r.id,{vrms:vr,irms:ir,p:pw,r:r.r});});
  C.Ds.forEach((d,j)=>{const is=per.map(s=>s.D[j].i);let pi=0;is.forEach((x,i)=>{if(x>is[pi])pi=i;});
    led.set(d.id,{imean:mean(is.map(x=>Math.max(x,0))),ipk:is[pi],vf:per[pi].D[j].v});lastVd.set(d.id,d.vd);});

  const mv=per.map(s=>s.mv),sm=stat(mv),bw=S.fg.on?1/Math.sqrt(1+(S.fg.f/5000)**2):1;

  const tab={c1:Float32Array.from(per.map(s=>s.ch1)),c2:Float32Array.from(per.map(s=>s.ch2))};

}

function bridgeParts(P){
  return [mkp('W','PS+','RU+_0'),mkp('W','PS-','RU-_0',{wcol:BLK}),
    mkp('R','RU+_2','T5_0',{val:P.R[0]}),mkp('R','T5_2','T10_0',{val:P.R[1]}),mkp('R','T5_3','T15_1',{val:P.R[2]}),

}
function bridgeSim(P){
  const parts=bridgeParts(P);parts.forEach(p=>{p.e=0;});
  const per=refSim(parts,{on:true,v:P.V,ilim:1},FG0,1).per[0];
  const rs=parts.filter(p=>p.type==='R'),vR=per.R.map(x=>x.v),I=vR.map((v,j)=>Math.abs(v/rs[j].val*1000));
  const VF1=P.V-vR[0];return {I,VF:[VF1,VF1-vR[1],VF1-vR[2],vR[6]],Itot:I[0],P:vR.map((v,j)=>v*v/rs[j].val*1000),pmax:Math.max(...vR.map((v,j)=>v*v/rs[j].val))};
}

  recalc(P){
    const sim=P.sim;
    P.R.forEach((r,i)=>{const rm=num('r'+i),im=num('i'+i);setO('si'+i,f3(sim.I[i]));setO('sp'+i,f3(sim.P[i]));setO('p'+i,isFinite(rm)&&isFinite(im)?f3(im*im*rm/1000):'—');});
    [P.V,...sim.VF].forEach((v,i)=>setO('sv'+i,f3(v)));setO('sit',f3(sim.Itot)+' mA');setO('spt',f3(P.V*sim.Itot)+' mW');
    const it=num('it'),v0=num('v0');setO('pt',isFinite(it)&&isFinite(v0)?f3(v0*it):'—');

      if(m.some(x=>!isFinite(x))){['m','s','x','n','p'].forEach(k=>setO(t+i+k,'—'));return;}
      const mu=mean(m),sd=sstd(m),er=m.map(x=>Math.abs(x-nm)/nm*100),pc=100*sd/mu;

  }
};

  <li>用 R1 = <b>${fmtOhm(P.r1)}</b>、R2 = <b>${fmtOhm(P.r2)}</b> 把 5 V 分壓,接到運算放大器 1 的負輸入(腳 2)當參考電壓 VR。</li>
  <li>訊號產生器設為正弦波、<b>f = ${P.f} Hz、Vpp = ${P.vpp} V、偏移 = ${P.off} V</b>,接到正輸入(腳 3)。</li>
  <li>輸出(腳 1)串聯 390 Ω 與 LED 到 GND。示波器 CH1 量輸入、CH2 量輸出,調整 T/div、V/div 與觸發,看到穩定的波形。</li></ol>
  ${FIG.l5a(P)}<p><button type="button" data-act="ref" data-arg="a">載入參考接線</button></p>
  <div class="row2"><label>VR 實測 (V) ${IN('vr')}</label><label>輸出高電位 (V) ${IN('hi')}</label><label>輸出低電位 (V) ${IN('lo')}</label><label>輸出為高電位的時間 (%) ${IN('du')}</label></div>
  <p class="ans">模擬值:VR ≈ ${f3(P.vref)} V;高電位 ${f3(P.hi)} V;低電位 ${f3(P.lo)} V;高電位時間約 ${f3(P.duty,3)} %。<span data-o="c1"></span></p>
  <h4>5.5.2 四段 LED 顯示</h4>
  <ol><li>5 個 10 kΩ 電阻從 +5 V 串到 GND,分出 1 V、2 V、3 V、4 V,分別接到四個比較器的負輸入。</li>
  <li>四個正輸入都接訊號產生器;每個輸出串聯 330 Ω 接 LED 到 GND。</li>
  <li>先把訊號產生器設成<b>振幅 0 V、偏移 ${P.lvl} V</b>(直流),觀察亮幾顆 LED。再改成三角波 0–5 V(Vpp 5、偏移 2.5)、1 Hz,用示波器比較輸入與各輸出。</li></ol>
  ${FIG.l5b()}<p><button type="button" data-act="ref" data-arg="b">載入參考接線</button> <span class="muted">(這個電路零件很多,可以先載入再研究接線)</span></p>
  <p>偏移 ${P.lvl} V 時,亮的 LED 有 ${IN('lit')} 顆 <span class="ans">答案:${P.lit} 顆</span> <span data-o="c2"></span></p>
  <p class="muted">討論:輸入電壓升高時,亮燈數為何會增加?輸出高電位為什麼不是 5 V?</p>`;},
  recalc(P){
    const dv=num('du'),h=num('hi'),l=num('lo'),vr=num('vr');
    const ok=[near(vr,P.vref,0.08,0.1),near(h,P.hi,0.1,0.2),near(l,P.lo,0.5,0.2),near(dv,P.duty,0.15,5)];
    const any=[vr,h,l,dv].some(isFinite);setChk('c1',any?ok.every((x,i)=>x||!isFinite([vr,h,l,dv][i])):null);
    const lit=num('lit');setChk('c2',isFinite(lit)?lit===P.lit:null);
  }
};

const LABS=[null,LAB1,LAB2,LAB3,LAB4,LAB5];
const FREE_HTML=`<h3>自由實驗</h3>
<p class="muted">沒有指定題目,自己決定要做什麼。儀器都需要自己設定。</p>
<ul><li><b>放元件:</b>選工具,在麵包板點兩個孔位。同一直排的 5 個孔相通,中間凹槽上下不相通,上下電源軌整條相通。</li>
<li><b>電源供應器:</b>設電壓與電流限制,再按「輸出 ON」。接 LED 一定要串聯電阻。</li>
<li><b>訊號產生器:</b>選波形、頻率、振幅與偏移。OUT 接訊號,GND 與示波器 GND 內部共地。</li>
<li><b>示波器:</b>用跳線把 CH1/CH2 接到要量的點;調 V/div、T/div、位置與觸發準位,波形才會穩定出現。</li>
<li><b>三用電表:</b>切到想量的檔位。量電壓要並聯,量電流要串聯,量電阻要先關電源。</li></ul>
<p class="muted" id="freetip">上方「範例電路」只會放好電路,儀器還是要自己調。</p>`;
function renderLab(){
  const n=LAB.cur;labbody.classList.remove('show-ans');setPressed($('labans'),false);
  if(n===0){labbody.innerHTML=FREE_HTML;$('labnew').hidden=$('labans').hidden=true;LAB.P=null;return;}
  $('labnew').hidden=$('labans').hidden=false;
  labbody.innerHTML=LABS[n].html(LAB.P);LABS[n].recalc(LAB.P);
}
function newLab(clear){
  const n=LAB.cur;if(n===0)return;
  LAB.P=LABS[n].gen();
  if(clear){S.parts=[];S.pending=null;lastVd.clear();S.ps.on=false;S.fg.on=false;syncPS();syncFG();changed();}
  renderLab();
}
labbody.addEventListener('input',()=>{if(LAB.cur)LABS[LAB.cur].recalc(LAB.P);});
labbody.addEventListener('change',()=>{if(LAB.cur)LABS[LAB.cur].recalc(LAB.P);});
labbody.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!LAB.cur)return;const L=LABS[LAB.cur],a=b.dataset.act;
  if(a==='ref'){const list=L.ref(LAB.P,b.dataset.arg);loadParts(list);say('已放好參考接線。儀器設定還是要自己調。');}
  else L.act&&L.act(a,LAB.P);});
bind('labsel','change',e=>{LAB.cur=+e.target.value;newLab(true);if(LAB.cur===0)renderLab();});
bind('labnew','click',()=>newLab(true));
bind('labans','click',()=>{const on=!labbody.classList.contains('show-ans');labbody.classList.toggle('show-ans',on);setPressed($('labans'),on);if(LAB.cur)LABS[LAB.cur].recalc(LAB.P);});
LAB.onChange=()=>{if(LAB.cur===1)LABS[1].recalc(LAB.P);};

/* ---------- 範例電路(只放電路) ---------- */
const add=(type,a,b,x={})=>S.parts.push(newPart(type,a,b,x));
const PRESETS=[
 {n:'LED + 限流電阻',tip:'電源供應器設 5 V、電流限制 0.1 A 並開啟輸出。示波器 CH1 量 T10 那排,三用電表可以量 LED 的順向電壓。',f(){
   add('W','PS+','RU+_0');add('W','PS-','RU-_0',{wcol:BLK});add('W','SCG','RU-_1',{wcol:BLK});
   add('R','RU+_3','T10_0',{val:330,e:tolErr(5)});add('LED','T10_2','RU-_5',{color:'red'});add('W','CH1','T10_1',{wcol:YEL});}},
 {n:'LED 閃爍',tip:'訊號產生器設方波、1 Hz、Vpp 5 V、偏移 2.5 V 並開啟輸出。示波器把 T/div 調到 200 ms。',f(){
   add('W','FGO','T5_0',{wcol:YEL});add('R','T5_2','T10_0',{val:330,e:tolErr(5)});add('LED','T10_2','RU-_4',{color:'green'});
   add('W','FGG','RU-_0',{wcol:BLK});add('W','CH1','T5_1',{wcol:YEL});add('W','CH2','T10_1',{wcol:BLU});}},
 {n:'電阻分壓',tip:'訊號產生器設正弦波、1 kHz、Vpp 6 V 並開啟輸出。示波器 T/div 調到 500 µs,CH2 的 V/div 比 CH1 小一檔。',f(){
   add('W','FGO','T5_0',{wcol:YEL});add('W','CH1','T5_2',{wcol:YEL});add('R','T5_4','T10_0',{val:1000,e:tolErr(5)});
   add('W','CH2','T10_2',{wcol:BLU});add('R','T10_4','RU-_6',{val:1000,e:tolErr(5)});add('W','FGG','RU-_0',{wcol:BLK});}},
 {n:'示範:LED 沒加電阻',tip:'電源供應器設 5 V、電流限制 0.5 A 並開啟輸出,LED 會因電流過大燒毀。',f(){
   add('W','PS+','T10_0');add('LED','T10_2','RU-_5',{color:'red'});add('W','PS-','RU-_0',{wcol:BLK});add('W','SCG','RU-_1',{wcol:BLK});add('W','CH1','T10_1',{wcol:YEL});}}
];
$('preset').innerHTML='<option value="">選擇範例…</option>'+PRESETS.map((p,i)=>`<option value="${i}">${p.n}</option>`).join('');
function loadPreset(i){S.parts=[];S.pending=null;lastVd.clear();PRESETS[i].f();hover(null,null);changed();
  if(LAB.cur!==0){LAB.cur=0;$('labsel').value=0;renderLab();}
  $('freetip').textContent='範例「'+PRESETS[i].n+'」:'+PRESETS[i].tip;say('已放好範例電路:'+PRESETS[i].n+'。儀器要自己調整。');}
bind('preset','change',e=>{if(e.target.value!=='')loadPreset(+e.target.value);e.target.value='';});
bind('clear','click',()=>{S.parts=[];S.pending=null;lastVd.clear();hover(null,null);changed();hint();});

/* ---------- 初始化 ---------- */
function syncAll(){syncPS();syncFG();
  $('c1on').checked=S.sc.on1;$('c2on').checked=S.sc.on2;$('vd1').value=S.sc.vd1;$('vd2').value=S.sc.vd2;$('td').value=S.sc.td;$('p1').value=0;$('p2').value=0;$('hp').value=0;$('tl').value=0;}
new ResizeObserver(()=>{if(R)drawScope(true);}).observe($('scr'));
syncAll();setTool('R');renderLab();loadPreset(0);hint();requestAnimationFrame(frame);
window.EE={S,points,changed,LABS,LAB,newLab,refresh,get R(){return R;},get C(){return C;},refSim,updateMeter};
})();
</script>
