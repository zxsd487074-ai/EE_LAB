<title>電子實驗模擬台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面:左側為工作檯(工具列、麵包板、元件讀數),右側為三台儀器;窄螢幕改為單欄 */
:root{
  --bg:#e8ebee; --panel:#f7f8f9; --panel-2:#eceff2; --line:#cbd2d9; --fg:#192027; --muted:#58656f;
  --accent:#0a7c76; --accent-fg:#ffffff; --ok:#1c8f4f; --bad:#d23f3f; --warn:#b7791f;
  --board:#e9e5d7; --board-edge:#b9b39d; --groove:#cfc9b6; --hole:#3b3f45; --hole-hi:#f0a800;
  --rail-p:#d64545; --rail-n:#3b6fd6; --metal:#9aa0a6; --lbl:#3a352a;
  --screen:#06100c; --seg:#7dff9a; --seg-bg:#0a1511;
  --font:'IBM Plex Sans','Noto Sans TC',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --panel:#171c21; --panel-2:#1e252b; --line:#2b343c; --fg:#e3e8ec; --muted:#8f9ba6;
  --accent:#3cc4bb; --accent-fg:#06201e; --ok:#3ccf7a; --bad:#ff6b6b; --warn:#e0a84a;
  --board:#d8d3c2; --board-edge:#8f8a76; --groove:#bfb9a5; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1317; --panel:#171c21; --panel-2:#1e252b; --line:#2b343c; --fg:#e3e8ec; --muted:#8f9ba6;
  --accent:#3cc4bb; --accent-fg:#06201e; --ok:#3ccf7a; --bad:#ff6b6b; --warn:#e0a84a;
  --board:#d8d3c2; --board-edge:#8f8a76; --groove:#bfb9a5; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;letter-spacing:.01em}
h2{font-size:13px;margin:0;font-weight:600;letter-spacing:.04em}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;max-width:1360px;margin:0 auto 14px}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,410px);gap:16px;align-items:start;max-width:1360px;margin:0 auto}
@media (max-width:1000px){.lab{grid-template-columns:minmax(0,1fr)}}
.bench,.instruments{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}

button,select,input{font:inherit;color:inherit}
button,select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:34px}
button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%;min-height:24px}
input[type=number]{width:84px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:34px;font-family:var(--mono)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 12px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center}
.sw{display:flex;gap:6px}
.sw button{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px;border-color:var(--panel)}
.board{padding:8px;overflow:hidden}
#board{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair;user-select:none}
.hint{margin:0;padding:0 2px;min-height:1.5em;color:var(--muted)}
.hint.warn{color:var(--bad);font-weight:500}

/* 麵包板 SVG */
.bb{fill:var(--board);stroke:var(--board-edge);stroke-width:1.5}
.groove{fill:var(--groove)}
.hole{fill:var(--hole)}
.hole.on{fill:var(--hole-hi)}
.rail-p{stroke:var(--rail-p);stroke-width:1.6}
.rail-n{stroke:var(--rail-n);stroke-width:1.6}
.tgrp{fill:var(--panel-2);stroke:var(--line)}
.tlabel{fill:var(--muted);font:500 10px var(--font);text-anchor:middle}
.tsub{fill:var(--fg);font:500 9px var(--mono);text-anchor:middle}
.cn{fill:var(--lbl);font:9px var(--mono);text-anchor:middle;opacity:.7}
.bbtxt{fill:var(--lbl);font:700 10px var(--mono);text-anchor:middle}
.com{stroke:var(--muted);stroke-dasharray:3 3;fill:none}
.leg{stroke:var(--metal);stroke-width:2.2;stroke-linecap:round}
.lbl{fill:var(--lbl);font:500 9px var(--mono);text-anchor:middle;paint-order:stroke;stroke:var(--board);stroke-width:3px}
.ring{fill:none;stroke:var(--hole-hi);stroke-width:2}
.ghost{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 4;fill:none}
.pin{fill:var(--metal)}

/* 讀數表 */
.readout{padding:10px 12px}
.readout h2{margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
.tbl td:first-child{font-family:var(--font);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.wrapx{overflow-x:auto}
.badge{display:inline-block;padding:0 7px;border-radius:10px;font:500 11px/18px var(--font);margin-left:6px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.empty{color:var(--muted);margin:2px 0}

/* 儀器 */
.inst{padding:0;overflow:hidden}
.inst>header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.tag{font:500 11px var(--mono);color:var(--muted)}
.inst-body{padding:12px;display:flex;flex-direction:column;gap:12px}
#scr{display:block;width:100%;aspect-ratio:5/4;border-radius:6px;background:var(--screen)}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{background:var(--screen);border-radius:6px;padding:8px 10px;font:12px/1.55 var(--mono);color:#cfe;font-variant-numeric:tabular-nums}
.mcol b{display:block;font-weight:500;margin-bottom:2px}
.mcol.c1 b{color:#ffd400}.mcol.c2 b{color:#28d7ff}
.mrow{display:flex;justify-content:space-between;gap:8px}.mrow span:first-child{opacity:.6}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{margin:0;padding:8px 10px 10px;border:1px solid var(--line);border-radius:6px;min-width:0;display:flex;flex-direction:column;gap:6px}
legend{padding:0 4px;font-weight:600}
fieldset.ch1 legend{color:#b08d00}fieldset.ch2 legend{color:#0a8fb0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) fieldset.ch1 legend{color:#ffd400}:root:not([data-theme="light"]) fieldset.ch2 legend{color:#28d7ff}}
:root[data-theme="dark"] fieldset.ch1 legend{color:#ffd400}:root[data-theme="dark"] fieldset.ch2 legend{color:#28d7ff}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row>label{white-space:nowrap}
.fld{display:flex;flex-direction:column;gap:2px}
.fld .row span{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.disp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lcd{background:var(--seg-bg);border-radius:6px;padding:8px 10px;color:var(--seg);font:500 26px/1.1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.lcd small{display:block;text-align:left;font:11px var(--font);opacity:.7;letter-spacing:.06em;margin-bottom:2px}
.lcd i{font-style:normal;font-size:14px;margin-left:4px;opacity:.8}
.mode{display:flex;gap:6px;align-items:center;font:500 12px var(--mono)}
.pill{padding:0 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);line-height:20px}
.pill.cv{color:var(--ok);border-color:var(--ok)}.pill.cc{color:var(--bad);border-color:var(--bad)}
.note{margin:0;color:var(--muted);font-size:12px}
.big{min-height:38px;font-weight:600}
</style>

<header class="top">
  <div>
    <h1>電子實驗模擬台</h1>
    <p class="sub">在麵包板上插電阻、LED 和跳線,接上電源供應器與訊號產生器,再用示波器量測。</p>
  </div>
  <div class="top-actions">
    <label for="preset">範例電路</label>
    <select id="preset" aria-label="載入範例電路"></select>
    <button id="clear" type="button">清除全部</button>
  </div>
</header>

<main class="lab">
  <section class="bench">
    <div class="toolbar panel" role="toolbar" aria-label="元件工具">
      <div class="tools">
        <button type="button" data-tool="R" aria-pressed="true">電阻</button>
        <button type="button" data-tool="LED" aria-pressed="false">發光二極體</button>
        <button type="button" data-tool="W" aria-pressed="false">跳線</button>
        <button type="button" data-tool="DEL" aria-pressed="false">刪除</button>
      </div>
      <div class="opts">
        <label id="optR" for="rval">阻值 <select id="rval"></select></label>
        <label id="optL" for="lcol" hidden>顏色 <select id="lcol"></select></label>
        <div id="optW" class="sw" role="group" aria-label="跳線顏色" hidden></div>
      </div>
    </div>
    <div class="board panel"><svg id="board" viewBox="0 0 660 435" role="img" aria-label="麵包板與儀器接線端子"></svg></div>
    <p id="hint" class="hint" aria-live="polite"></p>
    <div class="readout panel">
      <h2>元件讀數 <span class="tag">(交流訊號顯示 RMS / 平均)</span></h2>
      <div class="wrapx" id="rd"></div>
    </div>
  </section>

  <aside class="instruments">
    <section class="inst panel" aria-label="示波器">
      <header><h2>示波器</h2><span class="tag">DSO · 2 CH · 觸發:訊號產生器相位 0°</span></header>
      <div class="inst-body">
        <canvas id="scr" aria-label="示波器螢幕"></canvas>
        <p class="note" id="scnote" hidden></p>
        <div class="meas" id="meas"></div>
        <div class="cgrid">
          <fieldset class="ch1"><legend><label><input type="checkbox" id="c1on" checked> CH1</label></legend>
            <div class="row"><label for="vd1">電壓/格</label><select id="vd1"></select></div>
            <div class="row"><label for="p1">位置</label><input type="range" id="p1" min="-4" max="4" step="0.1" value="0"></div></fieldset>
          <fieldset class="ch2"><legend><label><input type="checkbox" id="c2on" checked> CH2</label></legend>
            <div class="row"><label for="vd2">電壓/格</label><select id="vd2"></select></div>
            <div class="row"><label for="p2">位置</label><input type="range" id="p2" min="-4" max="4" step="0.1" value="0"></div></fieldset>
        </div>
        <div class="row"><label for="td">時間/格</label><select id="td"></select></div>
      </div>
    </section>

    <section class="inst panel" aria-label="電源供應器">
      <header><h2>電源供應器</h2><span class="tag">DC 0–30 V · 0–1 A</span></header>
      <div class="inst-body">
        <div class="disp">
          <div class="lcd"><small>輸出電壓</small><span id="psv">0.00</span><i>V</i></div>
          <div class="lcd"><small>輸出電流</small><span id="psi">0.000</span><i>A</i></div>
        </div>
        <div class="fld"><div class="row"><label for="pv">設定電壓</label><span id="pvt"></span></div><input type="range" id="pv" min="0" max="30" step="0.1"></div>
        <div class="fld"><div class="row"><label for="pi">電流限制</label><span id="pit"></span></div><input type="range" id="pi" min="0.01" max="1" step="0.01"></div>
        <div class="row"><div class="mode"><span class="pill" id="pmode">OFF</span></div><button class="big" type="button" id="pon" aria-pressed="false">輸出 OFF</button></div>
      </div>
    </section>

    <section class="inst panel" aria-label="訊號產生器">
      <header><h2>訊號產生器</h2><span class="tag">1 Hz–1 MHz · 輸出阻抗 50 Ω</span></header>
      <div class="inst-body">
        <div class="seg" role="group" aria-label="波形">
          <button type="button" data-wave="sine" aria-pressed="true">正弦波</button>
          <button type="button" data-wave="square" aria-pressed="false">方波</button>
          <button type="button" data-wave="tri" aria-pressed="false">三角波</button>
        </div>
        <div class="fld"><div class="row"><label for="fval">頻率</label>
          <span><input type="number" id="fval" min="1" step="any" aria-label="頻率數值"> <select id="funit" aria-label="頻率單位"><option value="1">Hz</option><option value="1000">kHz</option><option value="1000000">MHz</option></select></span></div>
          <input type="range" id="fs" min="0" max="600" step="1" aria-label="頻率滑桿"></div>
        <div class="fld"><div class="row"><label for="fa">振幅(峰對峰)</label><span id="fat"></span></div><input type="range" id="fa" min="0" max="20" step="0.1"></div>
        <div class="fld"><div class="row"><label for="fo">直流偏移</label><span id="fot"></span></div><input type="range" id="fo" min="-10" max="10" step="0.1"></div>
        <div class="row"><span class="note">1 至 3 Hz 時 LED 會即時閃爍</span><button class="big" type="button" id="fon" aria-pressed="false">輸出 OFF</button></div>
      </div>
    </section>
  </aside>
</main>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- 單位格式 ---------- */
function eng(x,unit,d=3){
  if(!isFinite(x))return '—';
  if(Math.abs(x)<1e-12)return '0 '+unit;
  const pre=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']];
  const ax=Math.abs(x);const p=pre.find(([s])=>ax>=s*0.9995)||pre[pre.length-1];
  return Number((x/p[0]).toPrecision(d))+' '+p[1]+unit;
}
const fmtOhm=v=>eng(v,'Ω').replace(' ','');

/* ---------- 零件資料 ---------- */
const LEDC={red:{n:'紅',vf:2.0,c:'#ff453a'},yellow:{n:'黃',vf:2.1,c:'#ffd60a'},green:{n:'綠',vf:2.2,c:'#32d74b'},blue:{n:'藍',vf:3.0,c:'#3d8bff'},white:{n:'白',vf:3.1,c:'#f2f2f7'}};
const WIRES=['#e5484d','#2b2b2b','#3b7ddd','#2fa84f','#e8b400','#ee7c26'];
const RVALS=[10,47,100,220,330,470,1000,2200,4700,10000,47000,100000,1000000];
const BC=['#111','#7b3f00','#e03131','#f08c00','#f2d600','#2f9e44','#1c7ed6','#9c36b5','#868e96','#f8f9fa'];
function bands(v){let e=Math.floor(Math.log10(v))-1;let d=Math.round(v/10**e);if(d>=100){d=Math.round(d/10);e++;}
  const m=e>=0?BC[e]:(e===-1?'#c9a227':'#b0b0b0');return [BC[Math.floor(d/10)],BC[d%10],m,'#c9a227'];}

/* ---------- 狀態 ---------- */
const S={tool:'R',rval:330,lcol:'red',wcol:WIRES[0],parts:[],uid:1,pending:null,
  ps:{on:false,v:5,ilim:0.2},fg:{on:false,wave:'sine',f:1000,vpp:4,off:0},
  sc:{on1:true,on2:true,vd1:1,vd2:1,p1:0,p2:0,td:0.001}};
const lastVd=new Map();

/* ---------- 麵包板與端子座標 ---------- */
const svg=$('board');const points={};const strips=new Map();
const P=18,X0=70,colX=c=>X0+(c-1)*P;
const rowsTop=[175,193,211,229,247],rowsBot=[283,301,319,337,355];
const defs=el('defs',{},svg);const flt=el('filter',{id:'blur',x:'-150%',y:'-150%',width:'400%',height:'400%'},defs);el('feGaussianBlur',{stdDeviation:5},flt);
el('rect',{x:40,y:92,width:582,height:330,rx:8,class:'bb'},svg);
el('rect',{x:48,y:257,width:566,height:16,rx:3,class:'groove'},svg);
for(const c of [1,5,10,15,20,25,30])el('text',{x:colX(c),y:268.5,class:'cn'},svg).textContent=c;
// 電源軌
const rails=[['RU+',118,'p'],['RU-',136,'n'],['RL+',385,'p'],['RL-',403,'n']];
for(const [k,y,t] of rails){
  const ly=t==='p'?y-10:y+10;el('line',{x1:54,x2:608,y1:ly,y2:ly,class:t==='p'?'rail-p':'rail-n'},svg);
  el('text',{x:58,y:y+3.5,class:'bbtxt'},svg).textContent=t==='p'?'+':'−';
}
function addPoint(id,x,y,node,kind){points[id]={id,x,y,node,kind};if(kind==='hole'){const r=el('rect',{x:x-3.4,y:y-3.4,width:6.8,height:6.8,rx:1.4,class:'hole'},svg);(strips.get(node)||strips.set(node,[]).get(node)).push(r);}}
for(let c=1;c<=30;c++){rowsTop.forEach((y,i)=>addPoint(`T${c}_${i}`,colX(c),y,`T${c}`,'hole'));rowsBot.forEach((y,i)=>addPoint(`B${c}_${i}`,colX(c),y,`B${c}`,'hole'));}
for(const [k,y] of rails)for(let i=0;i<25;i++)addPoint(`${k}_${i}`,97+i*P+Math.floor(i/5)*9,y,k,'hole');
// 儀器端子
const TERM=[['PS+',70,'#d64545','+'],['PS-',110,'#2b2b2b','−'],['FGO',250,'#9aa0a6','OUT'],['FGG',290,'#2b2b2b','GND'],['CH1',430,'#e8b400','CH1'],['CH2',470,'#1fb6d9','CH2'],['SCG',510,'#2b2b2b','GND']];
for(const [x,w,t] of [[45,90,'電源供應器'],[225,90,'訊號產生器'],[405,130,'示波器']]){el('rect',{x,y:6,width:w,height:62,rx:6,class:'tgrp'},svg);el('text',{x:x+w/2,y:19,class:'tlabel'},svg).textContent=t;}
el('path',{d:'M290 54 V80 H510 V54',class:'com'},svg);
{const t=el('text',{x:400,y:83.5,class:'tlabel'},svg);t.textContent='GND 於儀器內部共地';t.setAttribute('style','paint-order:stroke;stroke:var(--bg);stroke-width:5px');}
for(const [id,x,c,t] of TERM){addPoint(id,x,38,id,'term');el('circle',{cx:x,cy:38,r:9,fill:c,stroke:'#0008','stroke-width':1},svg);el('circle',{cx:x,cy:38,r:3.4,fill:'#111'},svg);el('text',{x,y:61,class:'tsub'},svg).textContent=t;}
const gParts=el('g',{},svg),gOver=el('g',{},svg);
const ring=el('circle',{r:8,class:'ring',visibility:'hidden'},gOver);
const ghost=el('path',{class:'ghost',visibility:'hidden'},gOver);

/* ---------- 零件繪製 ---------- */
const wireCtrl=(A,B)=>{const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,arc=Math.min(26,6+len*0.18),mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
  let cx=mx-dy/len*arc,cy=my+dx/len*arc;if(cy>my){cx=mx+dy/len*arc;cy=my-dx/len*arc;}return {cx,cy};};
const ledEls=new Map();
const labelOf=p=>(p.type==='R'?'R':'D')+(S.parts.filter(q=>q.type===p.type).indexOf(p)+1);
function drawPart(p){
  const A=points[p.a],B=points[p.b];const g=el('g',{},gParts);
  if(p.type==='W'){const {cx,cy}=wireCtrl(A,B);const d=`M${A.x} ${A.y} Q${cx} ${cy} ${B.x} ${B.y}`;
    el('path',{d,fill:'none',stroke:'#0005','stroke-width':5.4,'stroke-linecap':'round'},g);
    el('path',{d,fill:'none',stroke:p.wcol,'stroke-width':3.4,'stroke-linecap':'round'},g);return;}

function renderParts(){

const bright=i=>i<5e-5?0:Math.min(1,Math.pow(i/0.015,0.6));

/* ---------- 互動 ---------- */
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:0,y:0};}
function nearest(x,y){let best=null,bd=1e9;for(const id in points){const p=points[id],d=Math.hypot(p.x-x,p.y-y),lim=p.kind==='term'?13:9;if(d<lim&&d<bd){bd=d;best=p;}}return best;}
function partDist(p,x,y){const A=points[p.a],B=points[p.b];
  if(p.type!=='W'){const dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy||1,t=clamp(((x-A.x)*dx+(y-A.y)*dy)/l2,0,1);return Math.hypot(A.x+t*dx-x,A.y+t*dy-y);}

function partAt(x,y){let best=null,bd=7;for(const p of S.parts){const d=partDist(p,x,y)-(p.type==='W'?0:2);if(d<bd){bd=d;best=p;}}return best;}
let hoverNode=null;
function hover(pt,q){

  if(pt&&S.tool!=='DEL'){ring.setAttribute('cx',pt.x);ring.setAttribute('cy',pt.y);ring.setAttribute('visibility','visible');}else ring.setAttribute('visibility','hidden');
  if(S.pending&&q){const A=points[S.pending.a],B=pt||q;ghost.setAttribute('d',`M${A.x} ${A.y} L${B.x} ${B.y}`);ghost.setAttribute('visibility','visible');}else ghost.setAttribute('visibility','hidden');
}
function place(pt){
  if(!S.pending){S.pending={a:pt.id};hover(pt,pt);hint();return;}
  if(S.pending.a===pt.id)return;
  const a=S.pending.a;
  if(S.tool==='R'&&Math.hypot(points[a].x-pt.x,points[a].y-pt.y)<34){say('電阻跨距太小,請拉開至少 2 格。',true);return;}
  S.parts.push({id:S.uid++,type:S.tool,a,b:pt.id,val:S.rval,color:S.lcol,wcol:S.wcol,burned:false,hot:false});

}
function removePart(id){S.parts=S.parts.filter(p=>p.id!==id);changed();}

  const pt=nearest(q.x,q.y);if(pt)place(pt);});
svg.addEventListener('contextmenu',e=>{e.preventDefault();const q=svgPt(e),p=partAt(q.x,q.y);if(p)removePart(p.id);});
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pending){S.pending=null;hover(null,null);hint();}});

const HINTS={R:['電阻:依序點兩個孔位放置(至少相隔 2 格)。','再點電阻的另一端。'],LED:['發光二極體:先點陽極(+),再點陰極(−)。平邊是陰極。','再點陰極(−)的位置。'],
  W:['跳線:點麵包板孔位或儀器端子,再點另一端。','再點跳線的另一端。'],DEL:['點選元件或跳線即可刪除,任何工具下按右鍵也能刪除。','']};
let hintTimer=0;
function hint(){const h=$('hint');h.classList.remove('warn');h.textContent=HINTS[S.tool][S.pending?1:0]||HINTS[S.tool][0];}
function say(msg,warn){const h=$('hint');h.textContent=msg;h.classList.toggle('warn',!!warn);clearTimeout(hintTimer);hintTimer=setTimeout(hint,6000);}

/* ---------- 電路求解(改良節點分析 + 牛頓法) ---------- */
const GMIN=1e-9;
function buildNets(){
  const par=new Map();
  const find=k=>{if(!par.has(k))par.set(k,k);let r=k;while(par.get(r)!==r)r=par.get(r);let c=k;while(par.get(c)!==r){const n=par.get(c);par.set(c,r);c=n;}return r;};
  const union=(a,b)=>{a=find(a);b=find(b);if(a!==b)par.set(a,b);};
  union('FGG','SCG');
  for(const p of S.parts)if(p.type==='W')union(points[p.a].node,points[p.b].node);
  return find;
}
function compile(){
  const find=buildNets(),earth=find('FGG'),idx=new Map();let N=0;
  const nid=k=>{const r=find(k);if(r===earth)return -1;if(!idx.has(r))idx.set(r,N++);return idx.get(r);};
  const Rs=[],Ds=[];
  for(const p of S.parts){if(p.type==='W')continue;const a=nid(points[p.a].node),b=nid(points[p.b].node);
    if(p.type==='R')Rs.push({id:p.id,a,b,r:p.val});
    else if(!p.burned){const nVt=2*0.02585,Is=0.02/Math.exp(LEDC[p.color].vf/nVt);Ds.push({id:p.id,a,b,nVt,Is,vcrit:nVt*Math.log(nVt/(Math.SQRT2*Is)),vd:lastVd.get(p.id)||0});}}
  const C={psp:nid('PS+'),psn:nid('PS-'),c1:nid('CH1'),c2:nid('CH2'),fgo:nid('FGO'),Rs,Ds};
  C.fgi=N++;C.N=N;return C;
}
function fgValue(t){const f=S.fg,ph=((t*f.f)%1+1)%1,A=f.vpp/2;
  if(f.wave==='sine')return f.off+A*Math.sin(2*Math.PI*ph);
  if(f.wave==='square')return f.off+(ph<0.5?A:-A);
  return f.off+A*(ph<0.5?4*ph-1:3-4*ph);}
function pnjlim(vn,vo,vt,vc){if(vn>vc&&Math.abs(vn-vo)>2*vt){if(vo>0){const a=1+(vn-vo)/vt;vn=a>0?vo+vt*Math.log(a):vc;}else vn=vt*Math.log(vn/vt);}return vn;}
function gauss(A,b,n){
  for(let c=0;c<n;c++){let p=c,m=Math.abs(A[c][c]);for(let r=c+1;r<n;r++){const v=Math.abs(A[r][c]);if(v>m){m=v;p=r;}}
    if(m<1e-30)continue;if(p!==c){[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];}
    const d=A[c][c];for(let r=c+1;r<n;r++){const f=A[r][c]/d;if(!f)continue;const Ar=A[r],Ac=A[c];for(let k=c;k<n;k++)Ar[k]-=f*Ac[k];b[r]-=f*b[c];}}
  const x=new Float64Array(n);
  for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=A[r][k]*x[k];x[r]=Math.abs(A[r][r])<1e-30?0:s/A[r][r];}
  return x;
}
const stamp=(A,i,j,g)=>{if(i>=0)A[i][i]+=g;if(j>=0)A[j][j]+=g;if(i>=0&&j>=0){A[i][j]-=g;A[j][i]-=g;}};
function runNewton(C,t,mode){
  const N=C.N,fgOn=S.fg.on;let nv=0;const fk=fgOn?nv++:-1,pk=mode==='cv'?nv++:-1,n=N+nv;
  const A0=Array.from({length:n},()=>new Float64Array(n)),b0=new Float64Array(n);
  for(let i=0;i<N;i++)A0[i][i]+=GMIN;
  if(C.c1>=0)A0[C.c1][C.c1]+=1e-6;if(C.c2>=0)A0[C.c2][C.c2]+=1e-6;   // 示波器輸入阻抗 1 MΩ
  for(const r of C.Rs)stamp(A0,r.a,r.b,1/r.r);
  if(fgOn){stamp(A0,C.fgi,C.fgo,1/50);const k=N+fk;A0[C.fgi][k]+=1;A0[k][C.fgi]+=1;b0[k]=fgValue(t);}
  if(pk>=0){const k=N+pk,p=C.psp,q=C.psn;if(p>=0){A0[p][k]+=1;A0[k][p]+=1;}if(q>=0){A0[q][k]-=1;A0[k][q]-=1;}b0[k]=S.ps.v;}
  if(mode==='cc'){if(C.psp>=0)b0[C.psp]+=S.ps.ilim;if(C.psn>=0)b0[C.psn]-=S.ps.ilim;}
  let x=new Float64Array(n);
  for(let it=0;it<(C.Ds.length?100:1);it++){
    const A=A0.map(r=>Float64Array.from(r)),b=Float64Array.from(b0);
    for(const d of C.Ds){const e=Math.exp(Math.min(d.vd/d.nVt,60)),g=d.Is/d.nVt*e+1e-12,ieq=d.Is*(e-1)-g*d.vd;stamp(A,d.a,d.b,g);if(d.a>=0)b[d.a]-=ieq;if(d.b>=0)b[d.b]+=ieq;}
    x=gauss(A,b,n);let conv=true;
    for(const d of C.Ds){const vn=(d.a>=0?x[d.a]:0)-(d.b>=0?x[d.b]:0);if(Math.abs(vn-d.vd)>1e-6)conv=false;d.vd=pnjlim(vn,d.vd,d.nVt,d.vcrit);}
    if(conv)break;
  }
  const V=i=>i<0?0:x[i];
  return {mode,psI:mode==='cv'?-x[N+pk]:(mode==='cc'?S.ps.ilim:0),psV:V(C.psp)-V(C.psn),ch1:V(C.c1),ch2:V(C.c2),
    D:C.Ds.map(d=>({id:d.id,v:d.vd,i:d.Is*(Math.exp(Math.min(d.vd/d.nVt,60))-1)})),R:C.Rs.map(r=>({id:r.id,v:V(r.a)-V(r.b)}))};
}
function simAt(C,t){
  const mode=!S.ps.on?'off':(C.psp===C.psn?'cc':'cv');
  let r=runNewton(C,t,mode);
  if(mode==='cv'&&r.psI>S.ps.ilim)r=runNewton(C,t,'cc');
  return r;
}

/* ---------- 分析:一個週期的統計 + 示波器波形 ---------- */
let R=null,C=null;
const SAMPLES=500;
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
function stat(a){let mx=-1e9,mn=1e9,s=0,q=0;for(const v of a){if(v>mx)mx=v;if(v<mn)mn=v;s+=v;q+=v*v;}return {max:mx,min:mn,pp:mx-mn,mean:s/a.length,rms:Math.sqrt(q/a.length)};}
function analyze(){
  let per;
  for(let pass=0;pass<5;pass++){
    C=compile();const nP=S.fg.on?120:1;per=[];
    for(let k=0;k<nP;k++)per.push(simAt(C,k/nP/S.fg.f));
    let burned=false;
    for(const p of S.parts){if(p.type!=='LED'||p.burned)continue;let pk=0;
      for(const s of per){const d=s.D.find(q=>q.id===p.id);if(d)pk=Math.max(pk,Math.abs(d.i));}
      if(pk>0.08){p.burned=true;burned=true;say(`${labelOf(p)} 因電流過大(${eng(pk,'A')})燒毀了。請在 LED 前串聯限流電阻。`,true);lastVd.delete(p.id);}}
    if(!burned)break;
  }
  const res=new Map(),led=new Map();
  C.Rs.forEach((r,j)=>{const v=per.map(s=>s.R[j].v);const vr=Math.sqrt(mean(v.map(x=>x*x))),ir=vr/r.r,pw=mean(v.map(x=>x*x/r.r));
    res.set(r.id,{vrms:vr,irms:ir,p:pw});});
  C.Ds.forEach((d,j)=>{const is=per.map(s=>s.D[j].i);let pi=0;is.forEach((x,i)=>{if(x>is[pi])pi=i;});
    led.set(d.id,{imean:mean(is.map(x=>Math.max(x,0))),ipk:is[pi],vf:per[pi].D[j].v});lastVd.set(d.id,d.vd);});
  for(const p of S.parts)if(p.type==='R'){const r=res.get(p.id),was=p.hot;p.hot=!!r&&r.p>0.25;if(p.hot&&!was)say(`${labelOf(p)} 功率 ${eng(r.p,'W')} 超過 1/4 W,電阻過熱了。`,true);}
  const ps={v:mean(per.map(s=>s.psV)),i:mean(per.map(s=>s.psI)),mode:per.some(s=>s.mode==='cc')?'cc':per[0].mode};
  const wave={c1:new Float32Array(SAMPLES),c2:new Float32Array(SAMPLES)};
  if(!S.fg.on){wave.c1.fill(per[0].ch1);wave.c2.fill(per[0].ch2);}
  else for(let k=0;k<SAMPLES;k++){const r=simAt(C,k/(SAMPLES-1)*10*S.sc.td);wave.c1[k]=r.ch1;wave.c2[k]=r.ch2;}
  R={res,led,ps,wave,s1:stat(per.map(s=>s.ch1)),s2:stat(per.map(s=>s.ch2))};
}

/* ---------- 示波器顯示 ---------- */
function drawScope(){
  const cv=$('scr'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w||!R)return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#06100c';g.fillRect(0,0,w,h);
  const dx=w/10,dy=h/8;g.lineWidth=1;
  for(let i=0;i<=10;i++){g.strokeStyle=i===5?'rgba(125,255,170,.38)':'rgba(125,255,170,.15)';g.beginPath();g.moveTo(Math.round(i*dx)+.5,0);g.lineTo(Math.round(i*dx)+.5,h);g.stroke();}
  for(let i=0;i<=8;i++){g.strokeStyle=i===4?'rgba(125,255,170,.38)':'rgba(125,255,170,.15)';g.beginPath();g.moveTo(0,Math.round(i*dy)+.5);g.lineTo(w,Math.round(i*dy)+.5);g.stroke();}
  g.strokeStyle='rgba(125,255,170,.4)';g.beginPath();
  for(let i=0;i<50;i++){const x=i*dx/5;g.moveTo(x,h/2-3);g.lineTo(x,h/2+3);}
  for(let i=0;i<40;i++){const y=i*dy/5;g.moveTo(w/2-3,y);g.lineTo(w/2+3,y);}g.stroke();
  const tr=(arr,col,vd,pos,lab)=>{
    g.save();g.strokeStyle=col;g.lineWidth=1.8;g.lineJoin='round';g.shadowColor=col;g.shadowBlur=6;g.beginPath();
    for(let k=0;k<SAMPLES;k++){const x=k/(SAMPLES-1)*w,y=clamp(h/2-(arr[k]/vd+pos)*dy,-30,h+30);k?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();g.restore();
    const y0=h/2-pos*dy;g.fillStyle=col;g.beginPath();g.moveTo(0,y0-5);g.lineTo(9,y0);g.lineTo(0,y0+5);g.fill();
    g.font='600 9px IBM Plex Mono, monospace';g.fillStyle='#000';g.fillText(lab,1.5,y0+3);};
  const s=S.sc;
  if(s.on1)tr(R.wave.c1,'#ffd400',s.vd1,s.p1,'1');if(s.on2)tr(R.wave.c2,'#28d7ff',s.vd2,s.p2,'2');
  g.font='11px IBM Plex Mono, monospace';g.textBaseline='bottom';let x=8;
  const txt=(t,c)=>{g.fillStyle=c;g.fillText(t,x,h-6);x+=g.measureText(t).width+14;};
  if(s.on1)txt('CH1 '+eng(s.vd1,'V')+'/div','#ffd400');if(s.on2)txt('CH2 '+eng(s.vd2,'V')+'/div','#28d7ff');txt(eng(s.td,'s')+'/div','#9fe8b8');
  const n=$('scnote'),dense=S.fg.on&&10*s.td*S.fg.f>60;n.hidden=!dense;if(dense)n.textContent='畫面內的週期太多,請縮小「時間/格」。';
}
function renderMeas(){
  const f=S.fg.on?S.fg.f:0;
  const col=(cls,name,s,on)=>{const ac=S.fg.on&&s.pp>1e-3;return `<div class="mcol ${cls}"><b>${name}${on?'':' (關閉)'}</b>`+
    [['峰對峰',eng(s.pp,'V')],['最大',eng(s.max,'V')],['最小',eng(s.min,'V')],['平均',eng(s.mean,'V')],['RMS',eng(s.rms,'V')],['頻率',ac?eng(f,'Hz'):'—']]

/* ---------- 讀數與儀器面板 ---------- */
function renderReadout(){
  const ps=S.parts.filter(p=>p.type!=='W');
  if(!ps.length){$('rd').innerHTML='<p class="empty">尚未放置電阻或 LED。選一個工具,在麵包板上點兩個孔位。</p>';return;}
  const rows=ps.map(p=>{const nm=labelOf(p);
    if(p.type==='R'){const r=R.res.get(p.id)||{vrms:0,irms:0,p:0};
      return `<tr><td>${nm} ${fmtOhm(p.val)}${p.hot?'<span class="badge bad">過熱</span>':''}</td><td>${eng(r.vrms,'V')}</td><td>${eng(r.irms,'A')}</td><td>${eng(r.p,'W')}</td></tr>`;}

  $('rd').innerHTML=`<table class="tbl"><thead><tr><th>元件</th><th>電壓</th><th>電流</th><th>功率</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderInstr(){
  const on=S.ps.on;$('psv').textContent=(on?Math.max(R.ps.v,0):0).toFixed(2);$('psi').textContent=(on?R.ps.i:0).toFixed(3);
  const m=!on?'off':R.ps.mode;const pm=$('pmode');pm.textContent=m==='cv'?'CV 定電壓':m==='cc'?'CC 限流中':'OFF';pm.className='pill '+(m==='off'?'':m);

/* ---------- 重新計算流程 ---------- */
let dirty=true;const changed=()=>{dirty=true;};
function refresh(){analyze();renderParts();drawScope();renderMeas();renderReadout();renderInstr();}
const live=()=>S.fg.on&&S.fg.f<=3&&C&&C.Ds.length;
function frame(){
  if(dirty){dirty=false;refresh();}
  else if(live()){const r=simAt(C,performance.now()/1000);for(const d of r.D)setBright(d.id,bright(Math.max(d.i,0)));}
  requestAnimationFrame(frame);
}

/* ---------- 控制項綁定 ---------- */
const bind=(id,ev,fn)=>$(id).addEventListener(ev,fn);
const setPressed=(btn,on)=>btn.setAttribute('aria-pressed',on);
// 工具
function setTool(t){S.tool=t;S.pending=null;hover(null,null);
  document.querySelectorAll('[data-tool]').forEach(b=>setPressed(b,b.dataset.tool===t));
  $('optR').hidden=t!=='R';$('optL').hidden=t!=='LED';$('optW').hidden=t!=='W';hint();}
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
$('rval').innerHTML=RVALS.map(v=>`<option value="${v}">${fmtOhm(v)}</option>`).join('');$('rval').value=330;
$('lcol').innerHTML=Object.entries(LEDC).map(([k,v])=>`<option value="${k}">${v.n}色</option>`).join('');
$('optW').innerHTML=WIRES.map((c,i)=>`<button type="button" aria-label="跳線顏色 ${i+1}" aria-pressed="${i===0}" style="background:${c}" data-w="${c}"></button>`).join('');
bind('rval','change',e=>{S.rval=+e.target.value;});bind('lcol','change',e=>{S.lcol=e.target.value;});
document.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{S.wcol=b.dataset.w;document.querySelectorAll('[data-w]').forEach(x=>setPressed(x,x===b));}));
// 示波器
const VD=[0.1,0.2,0.5,1,2,5,10],TD=[];for(let e=-5;e<=-1;e++)for(const m of [1,2,5])TD.push(m*10**e);TD.push(1);
$('vd1').innerHTML=$('vd2').innerHTML=VD.map(v=>`<option value="${v}">${eng(v,'V')}</option>`).join('');
$('td').innerHTML=TD.map(v=>`<option value="${v}">${eng(v,'s')}</option>`).join('');
bind('c1on','change',e=>{S.sc.on1=e.target.checked;changed();});bind('c2on','change',e=>{S.sc.on2=e.target.checked;changed();});
bind('vd1','change',e=>{S.sc.vd1=+e.target.value;changed();});bind('vd2','change',e=>{S.sc.vd2=+e.target.value;changed();});
bind('p1','input',e=>{S.sc.p1=+e.target.value;changed();});bind('p2','input',e=>{S.sc.p2=+e.target.value;changed();});
bind('td','change',e=>{S.sc.td=+e.target.value;changed();});
// 電源
const syncPS=()=>{$('pv').value=S.ps.v;$('pi').value=S.ps.ilim;$('pvt').textContent=S.ps.v.toFixed(1)+' V';$('pit').textContent=S.ps.ilim.toFixed(2)+' A';
  $('pon').textContent=S.ps.on?'輸出 ON':'輸出 OFF';setPressed($('pon'),S.ps.on);};
bind('pv','input',e=>{S.ps.v=+e.target.value;syncPS();changed();});bind('pi','input',e=>{S.ps.ilim=+e.target.value;syncPS();changed();});
bind('pon','click',()=>{S.ps.on=!S.ps.on;syncPS();changed();});
// 訊號產生器
function setFreq(f,fromSlider){f=clamp(f,1,1e6);S.fg.f=f;if(!fromSlider)$('fs').value=Math.round(Math.log10(f)*100);
  const u=f>=1e6?1e6:f>=1e3?1e3:1;$('funit').value=u;$('fval').value=+(f/u).toPrecision(4);changed();}
const syncFG=()=>{document.querySelectorAll('[data-wave]').forEach(b=>setPressed(b,b.dataset.wave===S.fg.wave));
  $('fa').value=S.fg.vpp;$('fo').value=S.fg.off;$('fat').textContent=S.fg.vpp.toFixed(1)+' Vpp';$('fot').textContent=S.fg.off.toFixed(1)+' V';
  $('fon').textContent=S.fg.on?'輸出 ON':'輸出 OFF';setPressed($('fon'),S.fg.on);setFreq(S.fg.f,false);};
document.querySelectorAll('[data-wave]').forEach(b=>b.addEventListener('click',()=>{S.fg.wave=b.dataset.wave;syncFG();}));
bind('fs','input',e=>setFreq(Number((10**(+e.target.value/100)).toPrecision(2)),true));
const fromInput=()=>{const v=parseFloat($('fval').value);if(v>0)setFreq(v*+$('funit').value,false);};
bind('fval','change',fromInput);bind('funit','change',fromInput);
bind('fa','input',e=>{S.fg.vpp=+e.target.value;syncFG();});bind('fo','input',e=>{S.fg.off=+e.target.value;syncFG();});
bind('fon','click',()=>{S.fg.on=!S.fg.on;syncFG();});

/* ---------- 範例電路 ---------- */
const BLK='#2b2b2b',RED=WIRES[0],YEL='#e8b400',BLU='#3b7ddd';
const add=(type,a,b,x={})=>S.parts.push({id:S.uid++,type,a,b,val:330,color:'red',wcol:RED,burned:false,hot:false,...x});
const PRESETS=[
 {n:'LED + 限流電阻(5 V 電源)',f(){
   add('W','PS+','RU+_0',{wcol:RED});add('W','PS-','RU-_0',{wcol:BLK});add('W','SCG','RU-_1',{wcol:BLK});
   add('R','RU+_3','T10_0',{val:330});add('LED','T10_2','RU-_5',{color:'red'});
   add('W','CH1','T10_1',{wcol:YEL});add('W','CH2','RU+_6',{wcol:BLU});
   Object.assign(S.ps,{on:true,v:5,ilim:0.2});S.fg.on=false;Object.assign(S.sc,{vd1:1,vd2:2,td:0.001,p1:0,p2:0});}},
 {n:'LED 閃爍(1 Hz 方波)',f(){
   add('W','FGO','T5_0',{wcol:YEL});add('R','T5_2','T10_0',{val:330});add('LED','T10_2','RU-_4',{color:'green'});
   add('W','FGG','RU-_0',{wcol:BLK});add('W','CH1','T5_1',{wcol:YEL});add('W','CH2','T10_1',{wcol:BLU});
   S.ps.on=false;Object.assign(S.fg,{on:true,wave:'square',f:1,vpp:5,off:2.5});Object.assign(S.sc,{vd1:2,vd2:1,td:0.2,p1:0,p2:0});}},
 {n:'電阻分壓(1 kHz 正弦波)',f(){
   add('W','FGO','T5_0',{wcol:YEL});add('W','CH1','T5_2',{wcol:YEL});add('R','T5_4','T10_0',{val:1000});
   add('W','CH2','T10_2',{wcol:BLU});add('R','T10_4','RU-_6',{val:1000});add('W','FGG','RU-_0',{wcol:BLK});
   S.ps.on=false;Object.assign(S.fg,{on:true,wave:'sine',f:1000,vpp:6,off:0});Object.assign(S.sc,{vd1:2,vd2:1,td:0.0005,p1:0,p2:0});}},
 {n:'示範:LED 沒加電阻(會燒毀)',f(){
   add('W','PS+','T10_0',{wcol:RED});add('LED','T10_2','RU-_5',{color:'red'});add('W','PS-','RU-_0',{wcol:BLK});add('W','SCG','RU-_1',{wcol:BLK});add('W','CH1','T10_1',{wcol:YEL});
   Object.assign(S.ps,{on:true,v:5,ilim:0.5});S.fg.on=false;Object.assign(S.sc,{vd1:1,vd2:1,td:0.001,p1:0,p2:0});}}
];
$('preset').innerHTML='<option value="">選擇範例…</option>'+PRESETS.map((p,i)=>`<option value="${i}">${p.n}</option>`).join('');
function syncAll(){syncPS();syncFG();
  $('c1on').checked=S.sc.on1;$('c2on').checked=S.sc.on2;$('vd1').value=S.sc.vd1;$('vd2').value=S.sc.vd2;$('p1').value=S.sc.p1;$('p2').value=S.sc.p2;$('td').value=S.sc.td;}
function loadPreset(i){S.parts=[];S.pending=null;lastVd.clear();PRESETS[i].f();syncAll();hover(null,null);changed();
  say(i===3?'這個範例會讓 LED 燒毀:沒有限流電阻,電流瞬間超過上限。':'已載入:'+PRESETS[i].n);}
bind('preset','change',e=>{if(e.target.value!=='')loadPreset(+e.target.value);e.target.value='';});
bind('clear','click',()=>{S.parts=[];S.pending=null;lastVd.clear();hover(null,null);changed();hint();});

new ResizeObserver(()=>{if(R)drawScope();}).observe($('scr'));
setTool('R');loadPreset(0);hint();requestAnimationFrame(frame);
})();
</script>
